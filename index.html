<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🎵 LePhiPhi.Com - Music Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #667eea; --secondary: #764ba2; --accent: #00d4ff;
    --bg: #0f0f1e; --border: rgba(255,255,255,0.1);
    --text: #fff; --text-dim: rgba(255,255,255,0.55);
  }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; align-items: stretch;
    -webkit-font-smoothing: antialiased; user-select: none;
    position: fixed; inset: 0;
  }
  body::before {
    content: ''; position: fixed; inset: -50%;
    background: radial-gradient(circle at 30% 20%, rgba(102,126,234,0.25), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(118,75,162,0.25), transparent 50%);
    animation: floatBg 20s ease-in-out infinite; z-index: 0;
  }
  @keyframes floatBg { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-5%,5%) scale(1.1)} }
  .player {
    position: relative; z-index: 1; width: 100%; max-width: 480px; height: 100%;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px);
  }
  .top-section { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding-top: 8px; }
  .logo-wrap {
    position: relative; width: min(65vw, 240px); aspect-ratio: 1;
    margin-bottom: 20px; display: flex; align-items: center; justify-content: center;
  }
  .logo-wrap::before {
    content: ''; position: absolute; inset: -12px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(102,126,234,0.6) 60deg,
      rgba(0,212,255,0.8) 180deg, rgba(118,75,162,0.6) 300deg, transparent 360deg);
    opacity: 0; transition: opacity 0.4s; animation: rotateRing 3s linear infinite;
    z-index: 0; filter: blur(8px);
  }
  .logo-wrap.playing::before { opacity: 1; }
  @keyframes rotateRing { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .logo-disc {
    position: relative; width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #1e1e3a, #0a0a18 70%);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 4px rgba(255,255,255,0.03),
                inset 0 0 60px rgba(102,126,234,0.15); z-index: 1;
  }
  .logo-disc::before {
    content: ''; position: absolute; inset: 8%; border-radius: 50%;
    background: repeating-radial-gradient(circle at center, transparent 0px, transparent 3px,
      rgba(255,255,255,0.02) 3px, rgba(255,255,255,0.02) 4px); pointer-events: none;
  }
  .logo-disc::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 30%,
      transparent 70%, rgba(102,126,234,0.1) 100%); pointer-events: none; z-index: 3;
  }
  .logo-content {
    position: relative; z-index: 2; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    width: 100%; height: 100%; padding: 20%;
  }
  .logo-text-main {
    font-weight: 900; font-size: clamp(20px, 5.5vw, 32px); letter-spacing: 1px; line-height: 1;
    background: linear-gradient(135deg, #fff 0%, #a8b8ff 50%, #667eea 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(102,126,234,0.4));
  }
  .logo-text-dot { -webkit-text-fill-color: #00d4ff; font-weight: 900; }
  .logo-subtitle {
    font-size: clamp(7px, 1.8vw, 10px); letter-spacing: 3px;
    color: rgba(168,184,255,0.7); margin-top: 6px; text-transform: uppercase; font-weight: 600;
  }
  .logo-waves {
    position: absolute; bottom: 12%; display: flex; gap: 3px;
    align-items: flex-end; height: 20px; z-index: 4;
  }
  .logo-waves span {
    width: 3px; background: linear-gradient(to top, var(--primary), var(--accent));
    border-radius: 2px; height: 30%; opacity: 0.8;
  }
  .logo-wrap.playing .logo-waves span { animation: wave 1s ease-in-out infinite; }
  .logo-waves span:nth-child(1){animation-delay:0s}
  .logo-waves span:nth-child(2){animation-delay:0.1s}
  .logo-waves span:nth-child(3){animation-delay:0.2s}
  .logo-waves span:nth-child(4){animation-delay:0.3s}
  .logo-waves span:nth-child(5){animation-delay:0.4s}
  .logo-waves span:nth-child(6){animation-delay:0.15s}
  .logo-waves span:nth-child(7){animation-delay:0.25s}
  @keyframes wave { 0%,100%{height:30%;opacity:0.6} 50%{height:100%;opacity:1} }
  .logo-inner {
    width: 100%; height: 100%; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .logo-inner.playing { animation: spinLogo 8s linear infinite; }
  .logo-inner.paused { animation-play-state: paused; }
  @keyframes spinLogo { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .logo-inner img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .center-hole {
    position: absolute; top: 50%; left: 50%; width: 22px; height: 22px;
    background: radial-gradient(circle, #0a0a18 30%, #1e1e3a 100%);
    border-radius: 50%; transform: translate(-50%, -50%);
    box-shadow: inset 0 0 8px rgba(0,0,0,0.9), 0 0 0 3px rgba(255,255,255,0.05); z-index: 5;
  }
  .center-hole::after {
    content: ''; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
    background: var(--primary); border-radius: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 10px var(--primary);
  }
  .song-title {
    font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 4px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .song-artist {
    font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 16px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
  .progress-container { width: 100%; margin-bottom: 14px; }
  .progress-bar {
    width: 100%; height: 20px; display: flex; align-items: center;
    cursor: pointer; touch-action: none; position: relative;
  }
  .progress-track {
    width: 100%; height: 4px; background: rgba(255,255,255,0.15);
    border-radius: 2px; position: relative;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
    border-radius: 2px; width: 0%; position: relative; pointer-events: none;
  }
  .progress-fill::after {
    content: ''; position: absolute; right: -6px; top: 50%; width: 12px; height: 12px;
    background: #fff; border-radius: 50%; transform: translateY(-50%);
    box-shadow: 0 2px 8px rgba(102,126,234,0.8); opacity: 0; transition: opacity 0.2s;
  }
  .progress-bar:hover .progress-fill::after, .progress-bar.dragging .progress-fill::after { opacity: 1; }
  .time-display {
    display: flex; justify-content: space-between; font-size: 11px;
    color: var(--text-dim); margin-top: 2px; font-variant-numeric: tabular-nums;
  }
  .controls {
    display: flex; justify-content: center; align-items: center;
    gap: 18px; margin-bottom: 14px; flex-shrink: 0;
  }
  .btn {
    background: transparent; border: none; color: var(--text);
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, background 0.15s; flex-shrink: 0;
  }
  .btn svg { width: 22px; height: 22px; fill: currentColor; }
  .btn:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }
  .btn-secondary { color: var(--text-dim); }
  .btn-secondary.active { color: var(--accent); }
  .btn-play {
    width: 62px; height: 62px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    box-shadow: 0 8px 24px rgba(102,126,234,0.45);
  }
  .btn-play svg { width: 26px; height: 26px; }
  .btn-play:active { transform: scale(0.92); }
  .playlist-wrap {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    border-top: 1px solid var(--border); padding-top: 12px;
  }
  .playlist-header {
    font-size: 11px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 1.5px; margin-bottom: 8px; padding-left: 4px; flex-shrink: 0;
  }
  .playlist-header .brand { color: var(--accent); font-weight: 700; }
  .playlist {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain; padding-bottom: 8px;
  }
  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  .playlist-item {
    display: flex; align-items: center; padding: 10px 8px; border-radius: 10px;
    cursor: pointer; transition: background 0.15s; margin-bottom: 2px;
  }
  .playlist-item:active { background: rgba(255,255,255,0.08); }
  .playlist-item.active { background: rgba(102,126,234,0.18); }
  .item-cover {
    width: 40px; height: 40px; border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; overflow: hidden; font-weight: 900; color: #fff;
  }
  .item-cover img { width: 100%; height: 100%; object-fit: cover; }
  .item-info { flex: 1; margin-left: 12px; min-width: 0; }
  .item-title {
    font-size: 13.5px; font-weight: 500; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .playlist-item.active .item-title { color: var(--accent); }
  .item-artist {
    font-size: 11.5px; color: var(--text-dim); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .playing-indicator {
    display: none; gap: 2px; align-items: flex-end;
    height: 14px; margin-left: 8px; flex-shrink: 0;
  }
  .playlist-item.active .playing-indicator { display: flex; }
  .playing-indicator span {
    width: 3px; background: var(--accent); border-radius: 1.5px;
    animation: equalize 0.8s ease-in-out infinite;
  }
  .playing-indicator span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .playing-indicator span:nth-child(2) { height: 80%; animation-delay: 0.2s; }
  .playing-indicator span:nth-child(3) { height: 55%; animation-delay: 0.4s; }
  .playlist-item.paused .playing-indicator span { animation-play-state: paused; }
  @keyframes equalize { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }
  .empty-state {
    text-align: center; padding: 30px 20px; color: var(--text-dim);
    font-size: 13px; line-height: 1.6;
  }
  .unmute-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    z-index: 999; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px; padding: 20px; text-align: center;
  }
  .unmute-overlay.show { display: flex; }
  .unmute-btn {
    width: 90px; height: 90px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border: none; color: #fff; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 10px 40px rgba(102,126,234,0.6);
    animation: pulse 2s ease-in-out infinite;
  }
  .unmute-btn svg { width: 42px; height: 42px; fill: #fff; }
  .unmute-btn:active { transform: scale(0.95); }
  @keyframes pulse {
    0%,100%{transform:scale(1);box-shadow:0 10px 40px rgba(102,126,234,0.6)}
    50%{transform:scale(1.05);box-shadow:0 10px 50px rgba(102,126,234,0.9)}
  }
  .unmute-text { font-size: 15px; color: rgba(255,255,255,0.85); max-width: 280px; line-height: 1.5; }
  .unmute-brand { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: 2px; margin-top: 8px; }
  @media (max-height: 700px) {
    .logo-wrap { width: min(48vw, 170px); margin-bottom: 12px; }
    .song-title { font-size: 16px; }
    .btn-play { width: 54px; height: 54px; }
    .btn-play svg { width: 22px; height: 22px; }
    .controls { gap: 14px; margin-bottom: 10px; }
    .logo-text-main { font-size: clamp(16px, 4.5vw, 24px); }
    .logo-subtitle { font-size: 7px; letter-spacing: 2px; }
    .center-hole { width: 16px; height: 16px; }
    .logo-waves { height: 14px; bottom: 8%; }
  }
  @media (max-height: 600px) {
    .logo-wrap { width: min(40vw, 130px); margin-bottom: 8px; }
    .song-artist { margin-bottom: 10px; }
  }
</style>
</head>
<body>

<div class="player">
  <div class="top-section">
    <div class="logo-wrap" id="logoWrap">
      <div class="logo-disc">
        <div class="logo-inner" id="logoInner">
          <div class="logo-content">
            <div class="logo-text-main">LePhiPhi<span class="logo-text-dot">.Com</span></div>
            <div class="logo-subtitle">Music Player</div>
          </div>
        </div>
        <div class="logo-waves">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="center-hole"></div>
    </div>
    
    <div class="song-title" id="songTitle">Đang tải...</div>
    <div class="song-artist" id="songArtist">Vui lòng chờ</div>
    
    <div class="progress-container">
      <div class="progress-bar" id="progressBar">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>
    
    <div class="controls">
      <button class="btn btn-secondary" id="shuffleBtn">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="btn" id="prevBtn">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="btn btn-play" id="playBtn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn" id="nextBtn">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="btn btn-secondary" id="repeatBtn">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
  </div>
  
  <div class="playlist-wrap">
    <div class="playlist-header">
      Danh sách phát · <span id="playlistCount">0</span> bài · <span class="brand">LePhiPhi.Com</span>
    </div>
    <div class="playlist" id="playlistList"></div>
  </div>
</div>

<audio id="audio" preload="auto" playsinline webkit-playsinline crossorigin="anonymous"></audio>

<div class="unmute-overlay" id="unmuteOverlay">
  <button class="unmute-btn" id="unmuteBtn">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  </button>
  <div class="unmute-text">Nhấn để bắt đầu phát nhạc 🎶<div class="unmute-brand">LePhiPhi.Com</div></div>
</div>

<script>
// ============================================================
// ⭐⭐⭐ CHỈ CẦN SỬA DUY NHẤT PHẦN NÀY ⭐⭐⭐
// ============================================================
// Dán danh sách link MP3 trực tiếp của bạn vào đây.
// Mỗi bài là 1 dòng, có dạng:
// { url: 'LINK_MP3', title: 'Tên bài', artist: 'Ca sĩ' }
// ============================================================

const SONGS = [
  { 
    url: 'https://nhac.lephiphi.com/list/DungYeuNuaEmMetRoi.mp3', 
    title: 'Đừng Yêu Nữa, Em Mệt Rồi', 
    artist: 'Min' 
  },
  { 
    url: 'https://raw.githubusercontent.com/user/repo/main/list/bai-hat-2.mp3', 
    title: 'Bài Hát Số 2', 
    artist: 'Ca sĩ B' 
  },
  { 
    url: 'https://raw.githubusercontent.com/user/repo/main/list/bai-hat-3.mp3', 
    title: 'Bài Hát Số 3', 
    artist: 'Ca sĩ C' 
  },
  // Thêm bao nhiêu bài cũng được, cứ copy dòng trên và sửa
];

// ============================================================
// KHÔNG CẦN SỬA GÌ PHÍA DƯỚI
// ============================================================

const OPTIONS = {
  autoPlay: true,      // Tự động phát khi vào trang
  defaultVolume: 0.8,  // Âm lượng (0-1)
};

// Tự điền title/artist nếu thiếu
const playlist = SONGS.map((s, i) => ({
  url: s.url.trim(),
  title: s.title || 'Bài hát ' + (i + 1),
  artist: s.artist || '',
  cover: s.cover || '',
}));

// ============================================================
// DOM
// ============================================================
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const songTitle = document.getElementById('songTitle');
const songArtist = document.getElementById('songArtist');
const playlistList = document.getElementById('playlistList');
const playlistCount = document.getElementById('playlistCount');
const unmuteOverlay = document.getElementById('unmuteOverlay');
const unmuteBtn = document.getElementById('unmuteBtn');
const logoWrap = document.getElementById('logoWrap');
const logoInner = document.getElementById('logoInner');

let currentIndex = 0;
let isPlaying = false;
let isSeeking = false;
let shuffleMode = false;
let repeatMode = 'none';
let history = [];

audio.volume = OPTIONS.defaultVolume;

const ICONS = {
  play: '<path d="M8 5v14l11-7z"/>',
  pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>',
};

// ============================================================
// RENDER
// ============================================================
function renderPlaylist() {
  playlistCount.textContent = playlist.length;
  playlistList.innerHTML = '';
  
  if (playlist.length === 0) {
    playlistList.innerHTML = `
      <div class="empty-state">
        Chưa có bài hát nào.<br><br>
        Mở file HTML, tìm mảng <b>SONGS</b> và dán link MP3 vào.
      </div>
    `;
    return;
  }
  
  playlist.forEach((song, index) => {
    const item = document.createElement('div');
    item.className = 'playlist-item' + (index === currentIndex ? ' active' : '');
    item.dataset.index = index;
    
    const coverContent = song.cover 
      ? `<img src="${song.cover}" alt="" loading="lazy">` 
      : `<span>LPP</span>`;
    
    item.innerHTML = `
      <div class="item-cover">${coverContent}</div>
      <div class="item-info">
        <div class="item-title">${escapeHtml(song.title)}</div>
        <div class="item-artist">${escapeHtml(song.artist || 'Không rõ')}</div>
      </div>
      <div class="playing-indicator"><span></span><span></span><span></span></div>
    `;
    
    item.addEventListener('click', () => {
      if (index === currentIndex) togglePlay();
      else loadSong(index, true);
    });
    
    playlistList.appendChild(item);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// LOAD
// ============================================================
function loadSong(index, autoPlay = false) {
  if (index < 0 || index >= playlist.length) return;
  currentIndex = index;
  const song = playlist[index];
  
  songTitle.textContent = song.title;
  songArtist.textContent = song.artist || 'Không rõ';
  
  if (song.cover) {
    logoInner.innerHTML = `<img src="${song.cover}" alt="">`;
  } else {
    logoInner.innerHTML = `
      <div class="logo-content">
        <div class="logo-text-main">LePhiPhi<span class="logo-text-dot">.Com</span></div>
        <div class="logo-subtitle">Music Player</div>
      </div>
    `;
  }
  
  progressFill.style.width = '0%';
  currentTimeEl.textContent = '0:00';
  totalTimeEl.textContent = '0:00';
  
  audio.src = song.url;
  audio.load();
  updatePlaylistUI();
  
  if (autoPlay) playSong();
}

// ============================================================
// PLAY / PAUSE
// ============================================================
function playSong() {
  if (playlist.length === 0) return;
  const p = audio.play();
  if (p !== undefined) {
    p.then(() => { setPlayingState(true); hideUnmuteOverlay(); })
     .catch(err => {
       setPlayingState(false);
       if (err.name === 'NotAllowedError') showUnmuteOverlay();
       else {
         songTitle.textContent = '⚠️ Không thể phát';
         songArtist.textContent = 'Kiểm tra link MP3';
       }
     });
  }
}

function pauseSong() { audio.pause(); setPlayingState(false); }
function togglePlay() { isPlaying ? pauseSong() : playSong(); }

function setPlayingState(playing) {
  isPlaying = playing;
  playIcon.innerHTML = playing ? ICONS.pause : ICONS.play;
  if (playing) {
    logoInner.classList.add('playing');
    logoInner.classList.remove('paused');
    logoWrap.classList.add('playing');
  } else {
    logoInner.classList.add('paused');
    logoWrap.classList.remove('playing');
  }
  updatePlaylistUI();
}

// ============================================================
// NEXT / PREV
// ============================================================
function nextSong(auto = false) {
  if (playlist.length === 0) return;
  if (repeatMode === 'one' && auto) { audio.currentTime = 0; playSong(); return; }
  
  if (shuffleMode && playlist.length > 1) {
    history.push(currentIndex);
    let r, a = 0;
    do { r = Math.floor(Math.random() * playlist.length); a++; } while (r === currentIndex && a < 20);
    loadSong(r, true);
  } else {
    const next = (currentIndex + 1) % playlist.length;
    if (next === 0 && repeatMode === 'none' && auto) { pauseSong(); loadSong(0, false); return; }
    loadSong(next, true);
  }
}

function prevSong() {
  if (playlist.length === 0) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (shuffleMode && history.length > 0) {
    loadSong(history.pop(), true);
  } else {
    loadSong((currentIndex - 1 + playlist.length) % playlist.length, true);
  }
}

// ============================================================
// UI
// ============================================================
function updatePlaylistUI() {
  const items = playlistList.querySelectorAll('.playlist-item');
  items.forEach((item, i) => {
    item.classList.toggle('active', i === currentIndex);
    item.classList.toggle('paused', !isPlaying);
  });
}

function formatTime(sec) {
  if (isNaN(sec) || !isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// ============================================================
// EVENTS
// ============================================================
playBtn.addEventListener('click', togglePlay);
nextBtn.addEventListener('click', () => nextSong(false));
prevBtn.addEventListener('click', prevSong);

audio.addEventListener('timeupdate', () => {
  if (!isSeeking && audio.duration && isFinite(audio.duration)) {
    progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
  }
});

audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('ended', () => {
  if (repeatMode === 'one') { audio.currentTime = 0; playSong(); }
  else nextSong(true);
});

audio.addEventListener('play', () => setPlayingState(true));
audio.addEventListener('pause', () => setPlayingState(false));

audio.addEventListener('error', () => {
  songTitle.textContent = '⚠️ Lỗi tải file';
  songArtist.textContent = 'Kiểm tra link MP3 có đúng không';
  setPlayingState(false);
});

audio.addEventListener('waiting', () => {
  songArtist.textContent = '⏳ Đang tải...';
});

audio.addEventListener('canplay', () => {
  const s = playlist[currentIndex];
  if (s) songArtist.textContent = s.artist || 'Không rõ';
});

// ============================================================
// SEEK
// ============================================================
function seekFromEvent(e) {
  const rect = progressBar.getBoundingClientRect();
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const percent = Math.max(0, Math.min(1, (x - rect.left) / rect.width));
  if (audio.duration && isFinite(audio.duration)) {
    audio.currentTime = percent * audio.duration;
    progressFill.style.width = (percent * 100) + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
  }
}

progressBar.addEventListener('mousedown', (e) => {
  isSeeking = true; progressBar.classList.add('dragging'); seekFromEvent(e);
});
document.addEventListener('mousemove', (e) => { if (isSeeking) seekFromEvent(e); });
document.addEventListener('mouseup', () => {
  if (isSeeking) { isSeeking = false; progressBar.classList.remove('dragging'); }
});
progressBar.addEventListener('touchstart', (e) => {
  isSeeking = true; progressBar.classList.add('dragging'); seekFromEvent(e);
}, { passive: true });
progressBar.addEventListener('touchmove', (e) => {
  if (isSeeking) seekFromEvent(e);
}, { passive: true });
progressBar.addEventListener('touchend', () => {
  isSeeking = false; progressBar.classList.remove('dragging');
});

// ============================================================
// SHUFFLE / REPEAT
// ============================================================
shuffleBtn.addEventListener('click', () => {
  shuffleMode = !shuffleMode;
  shuffleBtn.classList.toggle('active', shuffleMode);
  history = [];
});

repeatBtn.addEventListener('click', () => {
  const modes = ['none', 'all', 'one'];
  repeatMode = modes[(modes.indexOf(repeatMode) + 1) % modes.length];
  repeatBtn.classList.toggle('active', repeatMode !== 'none');
  repeatBtn.querySelector('svg').innerHTML = repeatMode === 'one'
    ? '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zM13 15V9h-1l-2 1v1h1.5v4H13z"/>'
    : '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';
});

// ============================================================
// OVERLAY
// ============================================================
function showUnmuteOverlay() { unmuteOverlay.classList.add('show'); }
function hideUnmuteOverlay() { unmuteOverlay.classList.remove('show'); }

unmuteBtn.addEventListener('click', () => {
  hideUnmuteOverlay();
  playSong();
});

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); nextSong(false); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); prevSong(); }
});

// ============================================================
// MEDIA SESSION
// ============================================================
if ('mediaSession' in navigator) {
  const updateMS = () => {
    const s = playlist[currentIndex];
    if (!s) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.title,
      artist: s.artist || 'LePhiPhi.Com',
      album: 'LePhiPhi.Com Music',
      artwork: s.cover ? [{ src: s.cover, sizes: '512x512', type: 'image/jpeg' }] : []
    });
  };
  navigator.mediaSession.setActionHandler('play', playSong);
  navigator.mediaSession.setActionHandler('pause', pauseSong);
  navigator.mediaSession.setActionHandler('previoustrack', prevSong);
  navigator.mediaSession.setActionHandler('nexttrack', () => nextSong(false));
  navigator.mediaSession.setActionHandler('seekto', (d) => {
    if (d.seekTime !== undefined) audio.currentTime = d.seekTime;
  });
  const _load = loadSong;
  loadSong = function(i, a) { _load(i, a); updateMS(); };
}

// ============================================================
// INIT
// ============================================================
function init() {
  renderPlaylist();
  if (playlist.length > 0) {
    loadSong(0, false);
    if (OPTIONS.autoPlay) setTimeout(() => playSong(), 100);
  }
}

init();
</script>

</body>
</html>
