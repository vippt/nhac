<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #667eea; --secondary: #764ba2; --accent: #00d4ff;

  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

  .player {

  .top-section { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding-top: 8px; }
  
  .logo-wrap {

  }
  .logo-wrap::before {

      rgba(0,212,255,0.8) 180deg, rgba(118,75,162,0.6) 300deg, transparent 360deg);

  }
  .logo-wrap.playing::before { opacity: 1; }
  @keyframes rotateRing { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  
  .logo-disc {
    position: relative; width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #1e1e3a, #0a0a18 70%);
    display: flex; align-items: center; justify-content: center; overflow: hidden;

  }
  .logo-disc::before {
    content: ''; position: absolute; inset: 8%; border-radius: 50%;

      rgba(255,255,255,0.02) 3px, rgba(255,255,255,0.02) 4px);
    pointer-events: none; z-index: 2;
  }
  .logo-disc::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 30%,
      transparent 70%, rgba(102,126,234,0.1) 100%); pointer-events: none; z-index: 3;
  }
  
  .logo-inner {
    width: 100%; height: 100%; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1;
  }
  .logo-inner.playing { animation: spinLogo 10s linear infinite; }
  .logo-inner.paused { animation-play-state: paused; }
  @keyframes spinLogo { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  
  #logoImg {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%;

  }
  
  .logo-waves {

    display: flex; gap: 2px; align-items: flex-end; height: 12px; z-index: 4;
  }

  }

  .logo-waves span:nth-child(2){animation-delay:0.1s}
  .logo-waves span:nth-child(3){animation-delay:0.2s}
  .logo-waves span:nth-child(4){animation-delay:0.3s}
  .logo-waves span:nth-child(5){animation-delay:0.4s}
  .logo-waves span:nth-child(6){animation-delay:0.15s}

  .btn-play {

  .playlist-wrap {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    border-top: 1px solid var(--border); padding-top: 12px;

  .playlist-header {
    font-size: 11px; color: var(--text-dim); text-transform: uppercase;

  .playlist-item {

    cursor: pointer; transition: background 0.15s; margin-bottom: 2px;
  }
  .playlist-item:active { background: rgba(255,255,255,0.08); }
  .playlist-item.active { background: rgba(102,126,234,0.18); }
  .item-cover {
    width: 40px; height: 40px; border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));

  .item-cover img { width: 100%; height: 100%; object-fit: cover; }
  .item-info { flex: 1; margin-left: 12px; min-width: 0; }
  .item-title {

  .playlist-item.active .item-title { color: var(--accent); }
  .item-artist {
    font-size: 11.5px; color: var(--text-dim); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .playing-indicator {
    display: none; gap: 2px; align-items: flex-end;
    height: 14px; margin-left: 8px; flex-shrink: 0;
  }
  .playlist-item.active .playing-indicator { display: flex; }
  .playing-indicator span {
    width: 3px; background: var(--accent); border-radius: 1.5px;
    animation: equalize 0.8s ease-in-out infinite;
  }
  .playing-indicator span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .playing-indicator span:nth-child(2) { height: 80%; animation-delay: 0.2s; }
  .playing-indicator span:nth-child(3) { height: 55%; animation-delay: 0.4s; }
  .playlist-item.paused .playing-indicator span { animation-play-state: paused; }
  @keyframes equalize { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }
  .empty-state {
    text-align: center; padding: 30px 20px; color: var(--text-dim);

  }
  
  .install-btn {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 20px);
    right: 20px;
    width: 58px; height: 58px;
    border-radius: 50%;

  .install-tooltip {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 90px);

  .install-tooltip::after {
    content: ''; position: absolute; bottom: -6px; right: 24px;

  .unmute-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);

    z-index: 999; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px; padding: 20px; text-align: center;

  .unmute-overlay.show { display: flex; }
  .unmute-btn {

  @keyframes pulse {

  songs: [
    { url: '/list/DungYeuNuaEmMetRoi.mp3', title: 'Đừng Yêu Nữa Em Mệt Rồi', artist: 'Min' },
    { url: '/list/gianhuanhlaem.mp3', title: 'Giá Như Anh Là Em', artist: 'Lệ Quyên' },
    { url: '/list/khongmondanghodoi.mp3', title: 'Không Môn Đăng Hộ Đối', artist: 'Nguyên Vĩ' },
    { url: '/list/kesaytinh3.mp3', title: 'Kẻ Say Tình 3', artist: 'Quốc Thiên' },
    { url: '/list/duongchantroi.mp3', title: 'Đường Chân Trời', artist: 'Tuna x Hồng Thuận' },
    { url: '/list/laviem.mp3', title: 'LAVIEM', artist: 'Quang Hùng Master D' },
    { url: '/list/timem.mp3', title: 'Tìm Em', artist: 'Hngle, Bảo Anh' },
    { url: '/list/nghidenngaychungtasegia.mp3', title: 'Nghĩ Đến Ngày Chúng Ta Sẽ Già', artist: 'Unknow' },
  ],
  
  autoPlay: true,
  defaultVolume: 0.8,
};

// ══════════════════════════════════════════════════════════
// KHÔNG CẦN SỬA GÌ DƯỚI ĐÂY
// ══════════════════════════════════════════════════════════

// Tự động set favicon, apple-icon, og:image từ CONFIG.logoUrl
if (CONFIG.logoUrl && CONFIG.logoUrl.startsWith('http')) {
  document.getElementById('favicon-link').href = CONFIG.logoUrl;
  document.getElementById('apple-icon-link').href = CONFIG.logoUrl;
  document.querySelector('meta[property="og:image"]').setAttribute('content', CONFIG.logoUrl);
  document.querySelector('meta[name="twitter:image"]').setAttribute('content', CONFIG.logoUrl);
}

// Tự sinh manifest PWA
const manifestData = {
  name: 'LePhiPhi.Com Music',
  short_name: 'LePhiPhi',
  description: 'Nghe nhạc online miễn phí chất lượng cao',
  start_url: location.origin + location.pathname,
  scope: location.origin + '/',
  display: 'standalone',
  orientation: 'portrait',
  background_color: '#0f0f1e',
  theme_color: '#0f0f1e',
  lang: 'vi',
  icons: [
    { src: CONFIG.logoUrl, sizes: '192x192', type: 'image/png', purpose: 'any' },
    { src: CONFIG.logoUrl, sizes: '512x512', type: 'image/png', purpose: 'any' },
    { src: CONFIG.logoUrl, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
  ]
};
const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

// Đăng ký Service Worker (cho PWA)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      e.respondWith(
        caches.match(e.request).then(cached => cached || fetch(e.request).catch(() => cached))
      );
    });
  `;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(swBlob))
    .then(() => console.log('✅ PWA Service Worker đã đăng ký'))
    .catch(err => console.warn('SW không đăng ký được:', err));
}

// Playlist
const playlist = CONFIG.songs.map((s, i) => ({
  url: s.url.trim(),
  title: s.title || 'Bài hát ' + (i + 1),
  artist: s.artist || '',
}));

// DOM
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const songTitle = document.getElementById('songTitle');
const songArtist = document.getElementById('songArtist');
const playlistList = document.getElementById('playlistList');
const playlistCount = document.getElementById('playlistCount');
const unmuteOverlay = document.getElementById('unmuteOverlay');
const unmuteBtn = document.getElementById('unmuteBtn');
const logoWrap = document.getElementById('logoWrap');
const logoInner = document.getElementById('logoInner');
const logoImg = document.getElementById('logoImg');
const installBtn = document.getElementById('installBtn');
const installTooltip = document.getElementById('installTooltip');

if (CONFIG.logoUrl) logoImg.src = CONFIG.logoUrl;

let currentIndex = 0;
let isPlaying = false;
let isSeeking = false;
let shuffleMode = false;
let repeatMode = 'none';
let history = [];
// Cờ đánh dấu đang trong tiến trình chuyển bài tự động (background)
let switchingTrack = false;

audio.volume = CONFIG.defaultVolume;
// Bật thuộc tính để browser giữ media session sống khi background (Chromium)
audio.setAttribute('x-webkit-airplay', 'allow');
audio.setAttribute('disablePictureInPicture', 'true');

const ICONS = { play: '<path d="M8 5v14l11-7z"/>', pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' };

// ══════════════════════════════════════════════════════════
// RENDER PLAYLIST
// ══════════════════════════════════════════════════════════
function renderPlaylist() {
  playlistCount.textContent = playlist.length;
  playlistList.innerHTML = '';
  
  if (playlist.length === 0) {
    playlistList.innerHTML = `<div class="empty-state">Chưa có bài hát nào.<br>Dán link MP3 vào mảng <b>songs</b> trong CONFIG.</div>`;
    return;
  }
  
  playlist.forEach((song, index) => {
    const item = document.createElement('div');
    item.className = 'playlist-item' + (index === currentIndex ? ' active' : '');
    item.innerHTML = `
      <div class="item-cover"><img src="${CONFIG.logoUrl}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='LPP'"></div>
      <div class="item-info">
        <div class="item-title">${escapeHtml(song.title)}</div>
        <div class="item-artist">${escapeHtml(song.artist || 'Không rõ')}</div>
      </div>
      <div class="playing-indicator"><span></span><span></span><span></span></div>
    `;
    item.addEventListener('click', () => {
      if (index === currentIndex) togglePlay();
      else loadSong(index, true);
    });
    playlistList.appendChild(item);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ══════════════════════════════════════════════════════════
// LOAD / PLAY / PAUSE
// ══════════════════════════════════════════════════════════
function loadSong(index, autoPlay = false) {
  if (index < 0 || index >= playlist.length) return;
  currentIndex = index;
  const song = playlist[index];
  songTitle.textContent = song.title;
  songArtist.textContent = song.artist || 'Không rõ';
  progressFill.style.width = '0%';
  currentTimeEl.textContent = '0:00';
  totalTimeEl.textContent = '0:00';
  // QUAN TRỌNG: chỉ set src, KHÔNG gọi audio.load()
  // để browser giữ "autoplay permission" khi đổi bài trong background
  audio.src = song.url;
  updatePlaylistUI();
  updateMediaSession();
  if (autoPlay) playSong();
}

function playSong() {
  if (playlist.length === 0) return;
  const p = audio.play();
  if (p !== undefined) {
    p.then(() => { setPlayingState(true); hideUnmuteOverlay(); })
     .catch(err => {
       setPlayingState(false);
       if (err.name === 'NotAllowedError') {
         // Nếu không phải background (do user vừa tương tác) thì hiện overlay
         if (!document.hidden) showUnmuteOverlay();
       } else {
         songTitle.textContent = '⚠️ Lỗi phát';
         songArtist.textContent = 'Kiểm tra link MP3';
       }
     });
  }
}

function pauseSong() { audio.pause(); setPlayingState(false); }
function togglePlay() { isPlaying ? pauseSong() : playSong(); }

function setPlayingState(playing) {
  isPlaying = playing;
  playIcon.innerHTML = playing ? ICONS.pause : ICONS.play;
  if (playing) {
    logoInner.classList.add('playing');
    logoInner.classList.remove('paused');
    logoWrap.classList.add('playing');
  } else {
    logoInner.classList.add('paused');
    logoWrap.classList.remove('playing');
  }
  updatePlaylistUI();

  // Cập nhật MediaSession playbackState (giúp OS biết app đang phát → cho phép chuyển bài khi tắt màn hình)
  if ('mediaSession' in navigator) {
    try { navigator.mediaSession.playbackState = playing ? 'playing' : 'paused'; } catch(e) {}
  }
}

function nextSong(auto = false) {
  if (playlist.length === 0) return;
  if (repeatMode === 'one' && auto) { audio.currentTime = 0; playSong(); return; }
  if (shuffleMode && playlist.length > 1) {
    history.push(currentIndex);
    let r, a = 0;
    do { r = Math.floor(Math.random() * playlist.length); a++; } while (r === currentIndex && a < 20);
    loadSong(r, true);
  } else {
    const next = (currentIndex + 1) % playlist.length;
    if (next === 0 && repeatMode === 'none' && auto) { pauseSong(); loadSong(0, false); return; }
    loadSong(next, true);
  }
}

function prevSong() {
  if (playlist.length === 0) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (shuffleMode && history.length > 0) loadSong(history.pop(), true);
  else loadSong((currentIndex - 1 + playlist.length) % playlist.length, true);
}

function updatePlaylistUI() {
  const items = playlistList.querySelectorAll('.playlist-item');
  items.forEach((item, i) => {
    item.classList.toggle('active', i === currentIndex);
    item.classList.toggle('paused', !isPlaying);
  });
}

function formatTime(sec) {
  if (isNaN(sec) || !isFinite(sec)) return '0:00';
  return `${Math.floor(sec / 60)}:${Math.floor(sec % 60).toString().padStart(2, '0')}`;
}

// ══════════════════════════════════════════════════════════
// MEDIA SESSION
// ══════════════════════════════════════════════════════════
function updateMediaSession() {
  if ('mediaSession' in navigator && playlist.length > 0) {
    const s = playlist[currentIndex];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.title,
      artist: s.artist || 'LePhiPhi.Com',
      album: 'LePhiPhi.Com Music',
      artwork: [
        { src: CONFIG.logoUrl, sizes: '192x192', type: 'image/png' },
        { src: CONFIG.logoUrl, sizes: '512x512', type: 'image/png' }
      ]
    });
  }
}

function updateMediaPosition() {
  if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && audio.duration && isFinite(audio.duration)) {
    try {
      navigator.mediaSession.setPositionState({
        duration: audio.duration,
        playbackRate: audio.playbackRate || 1,
        position: Math.min(audio.currentTime, audio.duration)
      });
    } catch (e) {}
  }
}

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', playSong);
  navigator.mediaSession.setActionHandler('pause', pauseSong);
  navigator.mediaSession.setActionHandler('previoustrack', prevSong);
  navigator.mediaSession.setActionHandler('nexttrack', () => nextSong(false));
  try {
    navigator.mediaSession.setActionHandler('seekto', (d) => {
      if (d.seekTime !== undefined) audio.currentTime = d.seekTime;
    });
  } catch(e) {}
  try {
    navigator.mediaSession.setActionHandler('seekbackward', (d) => {
      audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10));
    });
    navigator.mediaSession.setActionHandler('seekforward', (d) => {
      audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10));
    });
  } catch(e) {}
}

// ══════════════════════════════════════════════════════════
// EVENTS
// ══════════════════════════════════════════════════════════
playBtn.addEventListener('click', togglePlay);
nextBtn.addEventListener('click', () => nextSong(false));
prevBtn.addEventListener('click', prevSong);

audio.addEventListener('timeupdate', () => {
  if (!isSeeking && audio.duration && isFinite(audio.duration)) {
    progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
    // Giữ MediaSession "sống" khi tắt màn hình
    updateMediaPosition();
  }
});

audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = formatTime(audio.duration);
  updateMediaPosition();
});

// Xử lý khi bài hát kết thúc: chuyển bài + retry nếu bị block khi background
audio.addEventListener('ended', () => {
  switchingTrack = true;
  if (repeatMode === 'one') {
    audio.currentTime = 0;
    playSong();
  } else {
    nextSong(true);
  }
  // Retry nếu play bị block âm thầm khi tắt màn hình
  setTimeout(() => {
    switchingTrack = false;
    if (isPlaying && audio.paused && !audio.ended && playlist.length > 0) {
      playSong();
    }
  }, 1500);
});

audio.addEventListener('play', () => setPlayingState(true));
audio.addEventListener('pause', () => setPlayingState(false));

audio.addEventListener('error', (e) => {
  // Bỏ qua lỗi khi đang chuyển bài (src cũ bị abort)
  if (switchingTrack) return;
  songTitle.textContent = '⚠️ Lỗi tải file';
  songArtist.textContent = 'Kiểm tra link MP3';
  setPlayingState(false);
});

audio.addEventListener('waiting', () => songArtist.textContent = '⏳ Đang tải...');
audio.addEventListener('canplay', () => {
  const s = playlist[currentIndex];
  if (s) songArtist.textContent = s.artist || 'Không rõ';
});

// SEEK
function seekFromEvent(e) {
  const rect = progressBar.getBoundingClientRect();
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const percent = Math.max(0, Math.min(1, (x - rect.left) / rect.width));
  if (audio.duration && isFinite(audio.duration)) {
    audio.currentTime = percent * audio.duration;
    progressFill.style.width = (percent * 100) + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
  }
}
progressBar.addEventListener('mousedown', (e) => { isSeeking = true; progressBar.classList.add('dragging'); seekFromEvent(e); });
document.addEventListener('mousemove', (e) => { if (isSeeking) seekFromEvent(e); });
document.addEventListener('mouseup', () => { if (isSeeking) { isSeeking = false; progressBar.classList.remove('dragging'); } });
progressBar.addEventListener('touchstart', (e) => { isSeeking = true; progressBar.classList.add('dragging'); seekFromEvent(e); }, { passive: true });
progressBar.addEventListener('touchmove', (e) => { if (isSeeking) seekFromEvent(e); }, { passive: true });
progressBar.addEventListener('touchend', () => { isSeeking = false; progressBar.classList.remove('dragging'); });

// SHUFFLE / REPEAT
shuffleBtn.addEventListener('click', () => {
  shuffleMode = !shuffleMode;
  shuffleBtn.classList.toggle('active', shuffleMode);
  history = [];
});
repeatBtn.addEventListener('click', () => {
  const modes = ['none', 'all', 'one'];
  repeatMode = modes[(modes.indexOf(repeatMode) + 1) % modes.length];
  repeatBtn.classList.toggle('active', repeatMode !== 'none');
  repeatBtn.querySelector('svg').innerHTML = repeatMode === 'one'
    ? '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zM13 15V9h-1l-2 1v1h1.5v4H13z"/>'
    : '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';
});

// OVERLAY AUTOPLAY
function showUnmuteOverlay() { unmuteOverlay.classList.add('show'); }
function hideUnmuteOverlay() { unmuteOverlay.classList.remove('show'); }
unmuteBtn.addEventListener('click', () => { hideUnmuteOverlay(); playSong(); });

// KEYBOARD
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); nextSong(false); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); prevSong(); }
});

// ══════════════════════════════════════════════════════════
// VISIBILITY: khi quay lại tab, nếu đang "isPlaying" mà audio bị pause ngầm → play lại
// ══════════════════════════════════════════════════════════
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && isPlaying && audio.paused && !audio.ended && playlist.length > 0) {
    playSong();
  }
});

// ══════════════════════════════════════════════════════════
// PWA INSTALL
// ══════════════════════════════════════════════════════════
let deferredPrompt = null;
let installBtnShown = false;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches 
      || window.navigator.standalone === true;
}

function showInstallBtn() {
  if (installBtnShown || isStandalone()) return;
  installBtnShown = true;
  installBtn.classList.add('show');
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBtn();
});

window.addEventListener('appinstalled', () => {
  installBtn.classList.remove('show');
  installTooltip.classList.remove('show');
  deferredPrompt = null;
  console.log('✅ Đã cài PWA thành công');
});

setTimeout(() => {
  if (!deferredPrompt && !isStandalone()) {
    showInstallBtn();
    installTooltip.classList.add('show');
    setTimeout(() => installTooltip.classList.remove('show'), 6000);
  }
}, 4000);

installBtn.addEventListener('click', async () => {
  installTooltip.classList.remove('show');
  
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('User choice:', outcome);
    if (outcome === 'accepted') {
      installBtn.classList.remove('show');
    }
    deferredPrompt = null;
  } else {
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const msg = isIOS
      ? '📱 Để cài đặt trên iPhone/iPad:\n\n1. Nhấn vào biểu tượng Chia sẻ (⬆️) trên Safari\n2. Chọn "Thêm vào màn hình chính"\n3. Nhấn "Thêm"'
      : '📱 Để cài đặt:\n\n1. Mở menu trình duyệt (⋮)\n2. Chọn "Thêm vào màn hình chính" hoặc "Cài đặt ứng dụng"\n3. Nhấn "Cài đặt"';
    alert(msg);
  }
});

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
function init() {
  renderPlaylist();
  if (playlist.length > 0) {
    loadSong(0, false);
    if (CONFIG.autoPlay) setTimeout(() => playSong(), 100);
  }
}
init();
</script>
